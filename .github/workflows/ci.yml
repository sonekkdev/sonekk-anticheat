name: ci

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S guard/native -B guard/native/build -A x64
      - name: Build
        run: cmake --build guard/native/build --config Release
      - name: Test
        run: ctest --test-dir guard/native/build -C Release --output-on-failure

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Test all suites
        run: node run-tests.mjs
